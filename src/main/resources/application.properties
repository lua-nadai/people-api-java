spring.application.name=people-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/peopledb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
app.security.username=${API_USER:admin}
app.security.password=${API_PASSWORD:admin123}
app.nationalize.api-key=${NATIONALIZE_API_KEY:}
