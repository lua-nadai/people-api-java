<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de pessoas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <script src="/js/app.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <header class="bg-dark text-white">
    <div class="container py-4 d-flex justify-content-between align-items-center gap-3">
      <h1 class="h3 mb-0">Cadastro de pessoas</h1>
      <button id="logout" type="button" class="btn btn-outline-light btn-sm" hidden>Sair</button>
    </div>
  </header>
  <main class="container py-4">
    <div id="status" class="alert mb-4" role="status" aria-live="polite" hidden></div>
    <section class="card shadow-sm mb-4" id="login-panel" aria-labelledby="login-title">
      <div class="card-body p-4">
        <h2 id="login-title" class="h5 mb-3">Acesse o cadastro</h2>
        <form id="login" class="row g-3 align-items-end">
          <div class="col-sm"><label for="username" class="form-label">Usuário</label>
            <input id="username" class="form-control" autocomplete="username" required></div>
          <div class="col-sm"><label for="password" class="form-label">Senha</label>
            <input id="password" class="form-control" type="password" autocomplete="current-password" required></div>
          <div class="col-sm-auto"><button class="btn btn-primary" type="submit">Entrar</button></div>
        </form>
      </div>
    </section>
    <div id="workspace" hidden>
      <div class="row g-4 mb-4">
        <section class="col-lg-7" aria-labelledby="create-title">
          <div class="card shadow-sm h-100"><div class="card-body p-4">
            <h2 id="create-title" class="h5 mb-3">Novo cadastro</h2>
            <form id="create" class="row g-3">
              <div class="col-sm-6"><label for="name" class="form-label">Nome</label>
                <input id="name" name="name" class="form-control" maxlength="80" required></div>
              <div class="col-sm-6"><label for="surname" class="form-label">Sobrenome</label>
                <input id="surname" name="surname" class="form-control" maxlength="100" required></div>
              <div class="col-sm-6"><label for="document" class="form-label">CPF ou CNPJ</label>
                <input id="document" name="document" class="form-control" inputmode="numeric" pattern="[0-9]{11}|[0-9]{14}" maxlength="14" aria-describedby="document-hint" required>
                <div id="document-hint" class="form-text">Informe 11 ou 14 dígitos.</div></div>
              <div class="col-sm-6"><label for="email" class="form-label">E-mail</label>
                <input id="email" name="email" class="form-control" type="email" maxlength="150" required></div>
              <div class="col-12"><button type="submit" class="btn btn-primary">Cadastrar pessoa</button></div>
            </form>
          </div></div>
        </section>
        <section class="col-lg-5" aria-labelledby="nationality-title">
          <div class="card shadow-sm h-100"><div class="card-body p-4">
            <h2 id="nationality-title" class="h5 mb-3">Nacionalidade provável</h2>
            <form id="nationality" class="row g-3 align-items-end">
              <div class="col"><label for="person-id" class="form-label">ID da pessoa</label>
                <input id="person-id" class="form-control" inputmode="numeric" pattern="[1-9][0-9]*" required></div>
              <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Consultar</button></div>
            </form>
            <p id="prediction" class="mt-3 mb-0" role="status" aria-live="polite"></p>
          </div></div>
        </section>
      </div>
      <section class="card shadow-sm" aria-labelledby="people-title">
        <div class="card-header bg-body d-flex justify-content-between align-items-center gap-3 p-3">
          <h2 id="people-title" class="h5 mb-0">Pessoas cadastradas</h2>
          <button id="refresh" type="button" class="btn btn-outline-secondary btn-sm">Atualizar lista</button>
        </div>
        <p id="empty" class="text-body-secondary p-4 mb-0" hidden>Nenhuma pessoa cadastrada.</p>
        <div id="people-table" class="table-responsive" hidden>
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th scope="col">ID</th><th scope="col">Nome</th><th scope="col">Documento</th><th scope="col">E-mail</th><th scope="col">Ações</th></tr></thead>
            <tbody id="people"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
